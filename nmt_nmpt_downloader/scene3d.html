<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widoczność · model 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#153747;color:#edf5f6;font:15px system-ui,sans-serif}header{padding:12px 20px}h1{font-size:21px;margin:0 0 4px}p{margin:5px 0;line-height:1.5}#info,#texture-status,#status{font-size:12px;color:#bed8dc}details{padding:10px 20px;background:#1d4657}summary{cursor:pointer;color:#9ee1d1;font-weight:600}.controls{display:flex;flex-wrap:wrap;gap:14px 22px;padding:14px 0;align-items:center}label{display:flex;align-items:center;gap:8px}input[type=range]{width:115px}input[type=number]{width:65px}button,select,a{font:inherit;background:#a0dfcd;color:#133c49;border:0;border-radius:5px;padding:7px 10px;text-decoration:none}button,select{cursor:pointer}button:disabled{opacity:.5;cursor:default}output{min-width:33px}.viewer{position:relative}#view{display:block;width:100%;height:calc(100vh - 160px);min-height:400px;touch-action:none;background:#dce9e9}.map{position:absolute;top:12px;left:12px;padding:5px;background:#153747d9;border-radius:5px;font-size:11px}#locator{width:130px;height:130px;display:block;cursor:crosshair}#eye-status{position:absolute;bottom:8px;left:16px;background:#153747d9;padding:6px;max-width:90%;font-size:12px;pointer-events:none}#texture-status,#status{padding:3px 20px}#context-status{font-size:12px;max-width:1000px}#low,#high{font-size:12px}[hidden]{display:none!important}
</style>
<header><h1 id="title">Widoczność · model 3D</h1><p id="info"></p></header>
<details id="visualization"><summary>Wizualizacja</summary><div class="controls">
<label>Widok <select id="camera" title="Z oczu: rozglądanie z miejsca na mapce. Model: obrót całego terenu."><option value="orbit">Model — obrót</option><option value="top">Model — z góry</option><option value="eye">Z poziomu oczu</option></select></label>
<label>Miejsce <select id="viewpoint"><option value="-1">Wskaż na mapce</option></select></label>
<label><span id="bearing-label">Kierunek</span> <input id="bearing" type="range" min="0" max="360" value="225"><output id="bval"></output></label>
<label>Góra / dół <input id="tilt" type="range" min="8" max="80" value="28"><output id="tval"></output></label>
<label>Kąt widzenia <input id="fov" type="range" min="15" max="90" value="45"><output id="fval"></output></label>
<label>Oko nad gruntem <input id="eye-height" type="number" min="0.3" max="100" step="0.1" value="1.7"> m</label>
<label>Pokrycie <select id="surface-mode" title="Obiekty są ilustracyjne; wyników widoczności nie zmienia sposób rysowania."><option value="combined">NMPT + budynki i korony</option><option value="surface">Sama powierzchnia NMPT</option><option value="objects">NMT + obiekty z warstw</option></select></label>
<label title="Zdjęcie lotnicze na powierzchni modelu i dachach"><input id="photo" type="checkbox" disabled>Ortofotomapa</label>
<label><input id="lines" type="checkbox">Linie przekroju</label>
</div><div class="controls"><button id="look-turbine" title="Obróć aparat w stronę turbiny z aktualnego miejsca">Patrz na turbinę</button><button id="reset">Przywróć kamerę</button><button id="save">Zapisz PNG</button><a id="profile">Przekrój 2D</a><a id="fallback">Podgląd bez WebGL</a></div>
<p>Przeciągaj widok, aby się rozejrzeć. Kółko zmienia kąt widzenia z oczu. Po kliknięciu sceny strzałki / WASD przesuwają aparat. Miejsce wybierzesz też na mapce.</p>
<p id="context-status"></p><p><span id="low"></span> — <span id="high"></span></p>
</details>
<div hidden><input id="vertical" value="1"><output id="vval"></output><input id="sun" value="300"><select id="projection"><option value="perspective">Perspektywa</option></select><select id="material"><option value="height">Wysokość</option></select><input id="cover" type="checkbox" checked><input id="trees" type="checkbox" checked><input id="forest-objects" type="checkbox"><input id="buildings" type="checkbox" checked><input id="photo-shade" type="checkbox"><a id="download-texture"></a></div>
<div id="texture-status" role="status"></div><div id="status" role="status">Przygotowanie modelu…</div>
<div class="viewer"><canvas id="view" tabindex="0" aria-label="Model 3D terenu, zabudowy i roślinności"></canvas><div class="map"><canvas id="locator" width="320" height="320" aria-label="Kliknij miejsce patrzenia"></canvas>Kliknij miejsce patrzenia</div><p id="eye-status"></p></div>
